<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoológico Municipal Plínio Marim - Inscrição para Visita</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="..\imagens\logos\logo-zoo-branco.png" alt="logo zoologico" id="logo-zoo">
        <h1 id="titulo-zoo">Inscrição - Zoológico Municipal Plínio Marim</h1>
        <div class="placeholder" ></div>
    </header>

    <main>
        <p>Preencha o formulário abaixo para agendar sua visita.</p>

        <form action="#" method="post">
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="dadoPessoal">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <br>

                <div class="dadoPessoal">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <br>

                <div class="dadoPessoal">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" min="13" required>
                </div>
            </fieldset>

            <br><br>

            <fieldset>
                <legend>Contato</legend>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(17) 99999-9999" required>
                <br><br>

                <label>Possui WhatsApp?</label>
                <div class="simNao">
                    <span>
                        <input type="radio" id="sim" name="whatsapp" value="Sim">
                        <label for="sim">Sim</label>
                    </span>

                    <span>
                        <input type="radio" id="nao" name="whatsapp" value="Não">
                        <label for="nao">Não</label>
                    </span>
                </div>    
                </fieldset>

            <br><br>

            <fieldset>
                <legend>Tipo de Ingresso</legend>

                <label>Escolha a Categoria:</label><br><br>
                <div class="categorias">
                    <span>
                        <input type="radio" id="inteira" name="categoria" value="Inteira">
                        <label for="inteira">Inteira (R$ 35,00)</label>
                    </span>

                    <span>
                        <input type="radio" id="meia" name="categoria" value="Meia">
                        <label for="meia">Meia (R$ 17,50)</label>
                    </span>

                    <span>
                        <input type="radio" id="gratis" name="categoria" value="Grátis">
                        <label for="gratis">Gratuito (Idosos acima de 65 anos)</label>
                    </span>
                </div>
            </fieldset>

            <br><br>

            <fieldset>
                <legend>Termos de conduta</legend>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">
                    Declaro que li e aceito os <a href="../termos/index.html" target="_blank">termos de conduta</a> do Zoológico.
                </label>
            </fieldset>

            <br>

            <p id="mensagem" hidden></p>

            <div class="botoes">
                <button type="button" id="botaoValidar">Validar Inscrição</button>
                <button type="button" id="botaoEnviar" disabled>Enviar Inscrição</button>
            </div>

        </form>
        
        <br><br>

        <div class="botaoInicio">
            <a href="../index.html">Voltar à página incial</a>
        </div>
        <br>
    </main>

    <br>

    <footer>
        © 2026 Zoológico Municipal Plínio Marim - IFSP Votuporanga
    </footer>

    <script src="script.js"></script>
</body>

</html>
